<header class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-200 shadow-sm">
  <!-- Hamburger (mobile) -->
  <button (click)="menuToggle.emit()" class="p-1 rounded-md text-gray-500 hover:text-gray-700 lg:hidden">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <!-- Logo -->
  <div>
    <span class="brand-name text-base text-slate-800 tracking-tight">Pedid<span class="brand-ai">AI</span></span>
  </div>

  <!-- User section -->
  <div class="flex items-center gap-4">
    <!-- Language selector -->
    <div class="flex items-center gap-1 text-xs font-medium">
      <button
        (click)="setLang('ca')"
        class="px-2 py-1 rounded transition-colors"
        [class]="currentLang() === 'ca' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:text-gray-700'">
        CA
      </button>
      <span class="text-gray-300">|</span>
      <button
        (click)="setLang('es')"
        class="px-2 py-1 rounded transition-colors"
        [class]="currentLang() === 'es' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:text-gray-700'">
        ES
      </button>
    </div>

    @if (user) {
      <span class="text-sm text-gray-600">
        {{ user.firstName }} {{ user.lastName }}
        <span class="ml-1 text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">{{ user.role }}</span>
      </span>
    }
    <button (click)="logout()" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-red-500 transition-colors">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      {{ 'NAVBAR.LOGOUT' | translate }}
    </button>
  </div>
</header>
