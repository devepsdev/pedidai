<header class="flex items-center justify-between px-3 sm:px-6 py-1.5 sm:py-2 bg-white border-b border-gray-200 shadow-sm gap-2">
  <!-- Menú lateral (móvil y tableta) -->
  <button type="button" (click)="menuToggle.emit()"
    [attr.aria-label]="(menuOpen() ? 'NAV.CLOSE_MENU' : 'NAV.OPEN_MENU') | translate"
    [attr.aria-expanded]="menuOpen()" aria-controls="app-sidebar"
    class="inline-flex items-center justify-center w-11 h-11 -ml-1.5 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors lg:hidden shrink-0">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <!-- Logo -->
  <div class="shrink-0">
    <span class="brand-name text-base text-slate-800 tracking-tight">Pedid<span class="brand-ai">AI</span></span>
  </div>

  <!-- User section -->
  <div class="flex items-center gap-1 sm:gap-3 min-w-0">
    <!-- Idioma -->
    <div class="flex items-center gap-0.5 text-xs font-medium shrink-0" role="group" [attr.aria-label]="'NAV.LANGUAGE' | translate">
      <button type="button" (click)="setLang('es')" lang="es" [attr.aria-pressed]="currentLang() === 'es'"
        class="min-w-9 h-9 px-1.5 rounded-lg transition-colors"
        [class]="currentLang() === 'es' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-100'">
        ES
      </button>
      <button type="button" (click)="setLang('ca')" lang="ca" [attr.aria-pressed]="currentLang() === 'ca'"
        class="min-w-9 h-9 px-1.5 rounded-lg transition-colors"
        [class]="currentLang() === 'ca' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-100'">
        CA
      </button>
    </div>

    <!-- Nombre + rol: oculto en móvil -->
    @if (user) {
      <span class="hidden sm:flex items-center gap-2 min-w-0">
        <span class="text-sm text-gray-600 truncate max-w-[220px]">{{ user.firstName }} {{ user.lastName }}</span>
        <span class="shrink-0 whitespace-nowrap text-xs px-2 py-0.5 rounded-full"
              [class]="user.role === 'SUPER_ADMIN' ? 'bg-amber-50 text-amber-800 ring-1 ring-inset ring-amber-600/25' : 'bg-gray-100 text-gray-500'">
          {{ (user.role === 'SUPER_ADMIN' ? 'SUPERADMIN.ROLE.SUPER_ADMIN' : user.role === 'ADMIN' ? 'USERS.FORM.ROLE_ADMIN' : 'USERS.FORM.ROLE_USER') | translate }}
        </span>
      </span>
    }

    <!-- Salir: en móvil solo se ve el icono, pero el texto sigue ahí para lectores de pantalla -->
    <button type="button" (click)="logout()"
      class="inline-flex items-center justify-center gap-1.5 min-w-11 h-11 sm:px-3 rounded-lg text-sm font-medium text-gray-600 hover:text-red-600 hover:bg-red-50 transition-colors shrink-0">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="sr-only sm:not-sr-only">{{ 'NAVBAR.LOGOUT' | translate }}</span>
    </button>
  </div>
</header>
