<section id="faq" class="py-16 sm:py-20 bg-slate-50 scroll-mt-16">
  <div class="max-w-3xl lg:max-w-4xl mx-auto px-5 lg:px-8">
    <h2 class="text-3xl sm:text-4xl font-extrabold text-gray-900 text-center mb-10">{{ 'LANDING.FAQ.TITLE' | translate }}</h2>
    <div class="space-y-3">
      @for (i of questions; track i) {
        <details class="group bg-white rounded-xl border border-gray-200 px-5 py-4 open:shadow-sm">
          <summary class="flex items-center justify-between gap-4 cursor-pointer list-none font-semibold text-gray-900">
            {{ 'LANDING.FAQ.Q' + i | translate }}
            <span class="text-gray-400 transition-transform group-open:rotate-45 text-xl leading-none shrink-0" aria-hidden="true">+</span>
          </summary>
          <p class="mt-3 text-gray-600 leading-relaxed">@for (line of ('LANDING.FAQ.A' + i | translate | lines); track $index) {<span class="lg:block">{{ line }} </span>}</p>
        </details>
      }
    </div>
  </div>
</section>
