<section id="home" class="relative bg-gradient-to-br from-slate-900 to-blue-950 overflow-hidden">
  <!-- Logo de fondo con parallax -->
  <div class="absolute inset-0 flex items-center justify-center pointer-events-none" aria-hidden="true">
    <img src="logo-hero.png" alt="" class="w-[520px] h-auto opacity-[0.13] select-none"
      [style.transform]="'translateY(' + logoOffset() + 'px)'" style="will-change: transform;">
  </div>

  <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-72 h-72 bg-blue-500/10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative max-w-7xl mx-auto px-5 lg:px-8 pt-28 pb-16 lg:pt-36 lg:pb-24">
    <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_24rem] xl:grid-cols-[minmax(0,1fr)_24rem] gap-12 items-center">
      <!-- Texto -->
      <div class="text-center lg:text-left">
        <p class="inline-block px-3 py-1.5 bg-emerald-500/15 text-emerald-300 text-xs sm:text-sm font-semibold rounded-full border border-emerald-400/30 mb-6 text-balance sm:text-nowrap">
          {{ 'LANDING.HERO.BADGE' | translate }}
        </p>
        <h1 class="text-4xl sm:text-5xl lg:text-[2rem] xl:text-[2.875rem] font-extrabold text-white leading-tight tracking-tight">
          @for (line of ('LANDING.HERO.TITLE' | translate | lines); track $index) {<span class="sm:block">{{ line }} </span>}
        </h1>
        <p class="mt-6 text-lg sm:text-xl text-slate-300 max-w-xl lg:max-w-none mx-auto lg:mx-0">
          @for (line of ('LANDING.HERO.SUBTITLE' | translate | lines); track $index) {<span class="lg:block">{{ line }} </span>}
        </p>
        <div class="mt-8 flex flex-col items-center lg:items-start gap-3">
          <a routerLink="/register"
            class="w-full sm:w-auto inline-flex items-center justify-center px-8 py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/30 text-lg transition-colors">
            {{ 'CTA.TRIAL' | translate }}
          </a>
          <p class="text-sm text-slate-400">{{ 'LANDING.HERO.MICROCOPY' | translate }}</p>
        </div>
      </div>

      <!-- Vídeo del producto (bar y datos de ejemplo), en un marco de móvil -->
      <figure class="relative mx-auto w-[280px] sm:w-[300px] lg:w-[320px]">
        <div class="relative rounded-[2.25rem] bg-slate-800 p-2 shadow-2xl shadow-black/50 ring-1 ring-white/10">
          <video #demo class="block w-full aspect-[9/16] rounded-[1.75rem] bg-slate-900 object-cover"
            poster="video/pedidai-demo-poster.jpg" preload="none" playsinline loop [muted]="muted()"
            [attr.aria-label]="'LANDING.HERO.VIDEO_LABEL' | translate">
            <source src="video/pedidai-demo-1080.mp4" type="video/mp4" media="(min-width: 1024px)">
            <source src="video/pedidai-demo-720.mp4" type="video/mp4">
          </video>
        </div>
        <figcaption class="mt-3 flex items-center justify-between gap-3 px-1">
          <span class="text-xs text-slate-400">{{ 'LANDING.HERO.VIDEO_CAPTION' | translate }}</span>
          <button type="button" (click)="toggleSound()"
            class="inline-flex items-center gap-1.5 rounded-full bg-white/10 hover:bg-white/20 px-3 py-1.5 text-xs font-semibold text-white ring-1 ring-white/15 transition-colors">
            @if (muted()) {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5 6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>
              {{ 'LANDING.HERO.VIDEO_UNMUTE' | translate }}
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
              {{ 'LANDING.HERO.VIDEO_MUTE' | translate }}
            }
          </button>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
