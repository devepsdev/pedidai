<section id="how-it-works" class="py-16 sm:py-20 bg-white scroll-mt-16">
  <div class="max-w-6xl mx-auto px-5 lg:px-8">
    <div class="text-center mb-12">
      <h2 class="text-3xl sm:text-4xl font-extrabold text-gray-900">{{ 'LANDING.HOW.TITLE' | translate }}</h2>
      <p class="mt-3 text-lg text-gray-500 max-w-2xl mx-auto">{{ 'LANDING.HOW.SUBTITLE' | translate }}</p>
    </div>

    <ol class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (step of [1, 2, 3]; track step) {
        <li class="relative bg-slate-50 rounded-2xl p-6 border border-slate-100">
          <span class="w-11 h-11 bg-emerald-500 text-slate-950 text-lg font-extrabold rounded-xl flex items-center justify-center mb-4">{{ step }}</span>
          <h3 class="text-xl font-bold text-gray-900 mb-2">{{ 'LANDING.HOW.STEP' + step + '_TITLE' | translate }}</h3>
          <p class="text-gray-600 leading-relaxed">{{ 'LANDING.HOW.STEP' + step + '_TEXT' | translate }}</p>
        </li>
      }
    </ol>

    <div class="mt-10 text-center">
      <a routerLink="/register"
        class="w-full sm:w-auto inline-flex items-center justify-center px-7 py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition-colors">
        {{ 'CTA.TRIAL' | translate }}
      </a>
    </div>
  </div>
</section>
