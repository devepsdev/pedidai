# Configuració H2 per tests
spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuració JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Esquema generat per Hibernate a partir de les entitats (sempre sincronitzat)
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# Configuració de logging mínima
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN

# Desactivar funcionalitats innecessàries per tests
spring.h2.console.enabled=false
spring.main.banner-mode=off

# Configuració per tests de seguretat
management.endpoints.enabled=false
# Valors ficticis per als tests
app.jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtMTIzNDU2
deepseek.api.key=test
