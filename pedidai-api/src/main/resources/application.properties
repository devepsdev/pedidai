spring.application.name=pedidai-api
server.port=8085
server.servlet.context-path=/

# Secrets sempre per variables d'entorn (en producció, /opt/apps/pedidai/.env).
# SPRING_DATASOURCE_URL, si existeix, substitueix aquesta URL.
spring.datasource.url=jdbc:mysql://localhost:3306/pedidai_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER_PEDIDAI}
spring.datasource.password=${DB_PASS_PEDIDAI}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER_PEDIDAI}
spring.mail.password=${MAIL_PASS_PEDIDAI}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
spring.mail.from=${MAIL_USER_PEDIDAI}

app.frontend.url=https://pedidai.es

# CORS: en producció CORS_ALLOWED_ORIGINS fixa només els dominis públics
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://pedidai.es,https://www.pedidai.es,https://pedidai.com,https://www.pedidai.com,http://localhost:4200}

# Avís a n8n de cada registre nou (buit = desactivat)
app.n8n.new-company-webhook=${N8N_NEW_COMPANY_WEBHOOK:}

# Producció: INFO sense SQL. Per depurar en local:
#   --logging.level.com.pedidai.api=DEBUG --spring.jpa.show-sql=true
logging.level.root=INFO
logging.level.com.pedidai.api=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{0} - %msg%n

spring.jackson.default-property-inclusion=non_null

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1

server.forward-headers-strategy=framework
server.use-forward-headers=true
server.tomcat.redirect-context-root=false
server.tomcat.use-relative-redirects=false

springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.use-fqn=true

app.jwt.secret=${JWT_SECRET}

# IA per estructurar albarans (API compatible amb OpenAI). Per defecte Mistral AI (empresa europea, dades a la UE)
ai.api.url=${AI_API_URL:https://api.mistral.ai/v1}
ai.api.key=${AI_API_KEY:}
ai.model=${AI_MODEL:mistral-small-latest}

# Proxy for AI API calls (disabled - direct connection to the AI provider)
# app.proxy.host=10.9.9.2
# app.proxy.port=1080


# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
