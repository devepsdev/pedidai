# ── Genèrics ──
error.internal=Hi ha hagut un error inesperat. Torna-ho a provar d’aquí a uns minuts.
error.validation=Revisa les dades del formulari.
error.malformedRequest=La petició no és vàlida.
error.notFound=No s’ha trobat el que busques.
error.forbidden=No tens permís per fer això.
error.tooManyRequests=Massa intents. Espera una estona i torna-ho a provar.
error.invalidDate=El format de la data no és vàlid.
error.file.tooLarge=El fitxer és massa gran (màxim 10 MB).
error.pdf.failed=No s’ha pogut generar el PDF.

# ── Sessió i compte ──
error.auth.required=La teva sessió ha caducat. Torna a iniciar sessió.
error.auth.invalidCredentials=L’email o la contrasenya no són correctes.
error.auth.tooManyAttempts=Massa intents fallits. Espera 15 minuts i torna-ho a provar.
error.auth.userInactive=El teu usuari està desactivat. Parla amb l’administrador de la teva empresa.
error.auth.companySuspended=El compte de la teva empresa està suspès. Escriu-nos a hola@pedidai.es.
error.auth.trialEnded=La teva prova gratuïta s’ha acabat. Escriu-nos a hola@pedidai.es per activar el teu pla (29 €/mes amb el preu de llançament) i continuar on ho vas deixar.
error.auth.invalidResetToken=L’enllaç per canviar la contrasenya no és vàlid o ha caducat. Demana’n un de nou.
error.auth.invalidVerificationToken=L’enllaç de verificació no és vàlid o ha caducat. Demana’n un de nou des del teu tauler.
